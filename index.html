<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECHO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#F0EBE1;color:#1F2A37;font-family:'Atkinson Hyperlegible',system-ui,sans-serif;font-size:18px;line-height:1.5}
h1,h2,h3{font-family:'Lexend',system-ui,sans-serif;color:#1F2A37}
header.top{position:sticky;top:0;z-index:5;background:rgba(240,235,225,0.94);backdrop-filter:blur(8px);border-bottom:1px solid #E6E0D3}
.topin{max-width:760px;margin:0 auto;padding:12px 16px}
.brand{display:flex;justify-content:space-between;align-items:center;font-family:'Lexend',sans-serif;font-weight:600;font-size:15px;color:#2F6F6B}
.brandmark{display:inline-flex;align-items:center;gap:7px;letter-spacing:.03em;font-weight:800;color:#0F4D48;font-size:17px}
.brandmark svg{display:block}
.lockup{display:flex;align-items:center;gap:4px;margin-bottom:22px}
.lockup .wm{font-family:'Lexend',sans-serif;font-weight:800;font-size:46px;letter-spacing:.01em;color:#0F4D48;line-height:.95}
.lockup .tl{font-family:'Lexend',sans-serif;font-size:12.5px;letter-spacing:.2em;color:#CF6B3B;font-weight:700;margin-top:7px;text-transform:uppercase}
@keyframes rp{0%{opacity:.5}35%{opacity:1}100%{opacity:.5}}
.lockup .r1{animation:rp 2.6s ease-in-out infinite}
.lockup .r2{animation:rp 2.6s ease-in-out .35s infinite}
.lockup .r3{animation:rp 2.6s ease-in-out .7s infinite}
@media (prefers-reduced-motion:reduce){.lockup .r1,.lockup .r2,.lockup .r3{animation:none}}
body.setup .steps,body.setup .steplabel,body.setup nav.bottom,body.setup main{display:none}
#setupWrap{max-width:760px;margin:0 auto;padding:24px 16px 60px}
body:not(.setup) #setupWrap{display:none}
#setupWrap h2{font-size:26px;margin:0 0 6px}
#setupWrap .lead{color:#4A5563;margin:0 0 4px}
.field{display:block;font-weight:700;margin:18px 0 8px}
.inp{width:100%;font:inherit;padding:12px 14px;border:2px solid #DDD6C8;border-radius:12px;background:#FDFCF9;color:#1F2A37}
.inp:focus{outline:none;border-color:#2F6F6B;box-shadow:0 0 0 4px rgba(47,111,107,.15)}
#packet{min-height:130px;font-size:15px}
.fine{font-size:14px;color:#6B7280;margin:6px 0 0}
.msg{min-height:22px;font-size:15px;font-weight:700;margin-top:10px}
.msg.ok{color:#2F6F6B}.msg.bad{color:#B4583A}
.ready{display:flex;gap:10px;align-items:center;background:#E8F2F0;border-radius:12px;padding:10px 14px;font-weight:700;color:#1F5A4E;margin:12px 0 0}
.setupgo{margin-top:20px}
.textlink{background:none;border:0;color:#2F6F6B;font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:4px}
.center{text-align:center;margin-top:6px}
#linkOut,#promptOut,#parentOut,#teacherOut{display:none;margin-top:10px;min-height:80px;font-size:13px}
#linkOut.show,#promptOut.show,#parentOut.show,#teacherOut.show{display:block}
.pbox{margin-top:16px;padding:14px 16px;border-radius:14px;background:#F3F8F7;color:#3D4855;font-size:15px}
.prow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:10px 0 12px}
@media (max-width:560px){.prow{grid-template-columns:1fr}}
.intro{color:#3D4855;font-size:18px;margin:-6px 0 18px}
.stp{display:flex;gap:14px;background:#fff;border-radius:18px;padding:18px 18px 20px;margin-bottom:12px;box-shadow:0 1px 2px rgba(31,42,55,.06),0 6px 20px rgba(31,42,55,.05)}
.stp .num{flex:none;width:36px;height:36px;border-radius:50%;background:#E8F2F0;color:#2F6F6B;font-family:'Lexend',sans-serif;font-weight:700;font-size:16px;display:grid;place-items:center;transition:background .2s}
.stp.done .num{background:#2F6F6B;color:#fff}
.stp .bd{flex:1;min-width:0}
.stp h3{margin:5px 0 4px;font-size:19px}
.stp p{margin:0 0 12px;color:#4A5563;font-size:16px}
.stp .inp{margin-top:2px}
.alt{margin-top:12px;font-size:15px;color:#4A5563}
.alt[hidden]{display:none}
.ctx{background:#F6F3EC;border-radius:14px;padding:14px 16px}
.who .sendrow{align-items:center}
.who{border:1px solid #E4DED2;border-radius:14px;padding:14px 16px;margin-top:12px;background:#FDFCF9}
.whoh{font-family:'Lexend',sans-serif;font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.wdot{width:12px;height:12px;border-radius:50%;display:inline-block}
.wdot.stu{background:#2F6F6B}.wdot.fam{background:#3E6B4F;box-shadow:0 0 0 2px #CFE0D3}.wdot.tch{background:#2E4A6E}
.wsep{font-weight:400;color:#5B6675;font-size:15px}
.dims{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.dim{display:flex;flex-direction:column;gap:7px}
.dim .chip{width:100%;border-radius:12px}
.dim-h{font-family:'Lexend',sans-serif;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#5B6675;padding:0 2px}
@media (max-width:600px){.dims{grid-template-columns:1fr}}
.addc{margin-top:10px;font-size:15px}
.cbox{margin-top:8px}
.note{background:#F4F7FB;border:1px solid #DCE4EE;border-radius:12px;padding:12px 16px}
.note-h{font-weight:700;margin-bottom:4px}
.note ul{margin:0;padding-left:20px}
#printDoc{display:none}
body.class{background:#EDF1F6}
body.class header.top,body.class nav.bottom{background:rgba(237,241,246,.95);border-color:#D6DEE8}
body.class .brand,body.class .mini b,body.class .stat,body.class .status,body.class .msg.ok,body.class .goal .gl,body.class .textlink,body.class .tag{color:#2E4A6E}
body.class .btn{border-color:#2E4A6E}
body.class .btn.primary{background:#2E4A6E;color:#fff}
body.class .btn.primary:hover{background:#243B58}
body.class .btn.ghost{color:#2E4A6E;background:transparent}
body.class .chip.on,body.class .side.on{background:#2E4A6E;border-color:#2E4A6E}
body.class .on .mk{box-shadow:inset 0 0 0 3px #2E4A6E}
body.class .chip:hover,body.class .side:hover{border-color:#A9BCD3}
body.class .step.now::before{background:#2E4A6E}
body.class .step.done::before{background:#A9BCD3}
body.class .goal{border-left-color:#2E4A6E;background:#EEF2F8}
body.class .card.stack .answered{border-left-color:#2E4A6E!important}
body.class .speak,body.class .mic{color:#2E4A6E;background:#EEF2F8;border-color:#D3DDEA}
body.class .stp .num{background:#E2E9F2;color:#2E4A6E}
body.class .stp.done .num,body.class .check{background:#2E4A6E;color:#fff}
body.class textarea:focus,body.class .inp:focus,body.class .othertxt:focus{border-color:#2E4A6E;box-shadow:0 0 0 4px rgba(46,74,110,.15)}
body.class .summary{border-left-color:#A9BCD3}
body.class .ready{background:#E2E9F2;color:#243B58}
body.class .hcol.good .hcol-h{color:#2E4A6E}
body.class .hcol.good{background:#EEF2F8}
body.class .adultzone[style]{border-color:#A9BCD3!important;background:#F2F5FA!important}
body.class .diy{border-color:#D6DEE8}
body.home{background:#EEF2EC}
body.home header.top,body.home nav.bottom{background:rgba(238,242,236,.95);border-color:#D9E2D7}
body.home .brand,body.home .mini b,body.home .stat,body.home .status,body.home .msg.ok,body.home .goal .gl,body.home .textlink,body.home .tag{color:#3E6B4F}
body.home .btn{border-color:#3E6B4F}
body.home .btn.primary{background:#3E6B4F;color:#fff}
body.home .btn.primary:hover{background:#335A41}
body.home .btn.ghost{color:#3E6B4F;background:transparent}
body.home .chip.on,body.home .side.on{background:#3E6B4F;border-color:#3E6B4F}
body.home .on .mk{box-shadow:inset 0 0 0 3px #3E6B4F}
body.home .chip:hover,body.home .side:hover{border-color:#A9C2B0}
body.home .step.now::before{background:#3E6B4F}
body.home .step.done::before{background:#A9C2B0}
body.home .goal{border-left-color:#3E6B4F;background:#EEF4EF}
body.home .card.stack .answered{border-left-color:#3E6B4F!important}
body.home .speak,body.home .mic{color:#3E6B4F;background:#EEF4EF;border-color:#D3E2D6}
body.home .stp .num{background:#E3ECE5;color:#3E6B4F}
body.home .stp.done .num,body.home .check{background:#3E6B4F;color:#fff}
body.home textarea:focus,body.home .inp:focus,body.home .othertxt:focus{border-color:#3E6B4F;box-shadow:0 0 0 4px rgba(62,107,79,.15)}
body.home .summary{border-left-color:#A9C2B0}
body.home .ready{background:#E3ECE5;color:#2E5240}
.sendrow{display:flex;flex-wrap:wrap;gap:10px}
.hcols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
.follow:has(.hcols){background:#FAF8F3;border:1px solid #ECE6DA}
.hcol{display:flex;flex-direction:column;gap:8px;background:#FBEDE6;border-radius:12px;padding:10px}
.hcol .chip{width:100%;border-radius:12px;align-items:flex-start;text-align:left}
.hcol-h{font-family:'Lexend',sans-serif;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:2px 4px 4px}
.hcol.hard .hcol-h{color:#B4583A}
.hcol.good .hcol-h{color:#3E6B4F}
.hcol.good{background:#EEF4EF}
@media (max-width:560px){.hcols{grid-template-columns:1fr}}
.diy{margin-top:18px;padding:16px 18px;border-radius:14px;background:#fff;border:1px solid #D9E2D7}
.diy h4{margin:0 0 10px;font-family:'Lexend',sans-serif;font-size:16px}
.diy ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px;font-size:16px}
.diy .em{display:inline-block;margin-top:4px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:17px;font-weight:700;background:#FFF8EC;border:1.5px dashed #E3A88F;border-radius:8px;padding:5px 10px;user-select:all;word-break:break-all;color:#1F2A37}
.diy kbd{font-family:'Lexend',sans-serif;font-size:14px;font-weight:600;background:#F0EBE1;border:1px solid #CFC8B8;border-bottom-width:3px;border-radius:6px;padding:1px 7px}
.sendrow .btn{font-size:17px}
.printhead svg{vertical-align:middle;margin-right:6px}
.steps{display:flex;gap:6px;margin-top:2px}
.step{flex:1;height:26px;border:0;padding:0;background:transparent;cursor:pointer;position:relative;border-radius:8px}
.step::before{content:"";position:absolute;left:0;right:0;top:9px;height:8px;border-radius:99px;background:#E3DDCF;transition:background .2s}
.step.done::before{background:#9CC3BD}
.step.now::before{background:#2F6F6B}
.step:focus-visible,.btn:focus-visible,.speak:focus-visible,.mic:focus-visible,.textlink:focus-visible{outline:3px solid #E9A88D;outline-offset:2px}
.screen h1:focus,.screen h2:focus{outline:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.steplabel{font-size:14px;color:#5B6675;margin-top:6px}
main{max-width:760px;margin:0 auto;padding:24px 16px 130px}
.screen{display:none}
.screen.show{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:#fff;border-radius:20px;padding:22px;box-shadow:0 1px 2px rgba(31,42,55,.06),0 6px 20px rgba(31,42,55,.05);margin-bottom:18px}
.card.featured{border:2px solid #E9B59F;background:#FFFCFA}
.kicker{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#C2694A}
.sec-title{font-size:30px;margin:4px 0 6px;font-weight:600}
.sec-intro{color:#4A5563;margin:0 0 20px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.qhead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.qhead h3{font-size:19px;font-weight:500;margin:0;line-height:1.35}
.hint{font-size:15px;color:#6B7280;margin:-4px 0 14px}
.speak{flex:none;width:40px;height:40px;border-radius:50%;border:2px solid #D9E7E4;background:#F1F7F6;color:#2F6F6B;display:grid;place-items:center;cursor:pointer;padding:0}
.speak:hover{background:#E1EFEC}
.speak.wide{width:auto;height:auto;padding:9px 16px;border-radius:999px;display:inline-flex;gap:8px;align-items:center;font-family:'Lexend',sans-serif;font-weight:500;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.opt{position:relative;cursor:pointer;user-select:none;transition:background .15s,border-color .15s,color .15s}
.opt input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.opt:focus-within{outline:3px solid #E9A88D;outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:9px;padding:10px 16px;border:2px solid #DDD6C8;border-radius:999px;background:#fff;font-size:17px}
.chip:hover{border-color:#9CC3BD}
.chip.on{background:#2F6F6B;border-color:#2F6F6B;color:#fff}
.chip.small{font-size:15px;padding:8px 14px}
.chip.unsure{border-style:dashed}
.chip.add{border-style:dashed;border-color:#E3A88F;color:#B4583A;background:#FFF8F4;font-weight:700}
.chip.add::before{content:"+";font-size:21px;line-height:1;font-weight:700}
.chip.add .mk{display:none}
.chip.add.on{background:#C2694A;border-color:#C2694A;color:#fff}
.mk{width:16px;height:16px;border:2px solid #A6AEB8;border-radius:50%;flex:none}
.mk.checkbox{border-radius:5px}
.on .mk{border-color:#fff;background:#fff;box-shadow:inset 0 0 0 3px #2F6F6B}
.otherwrap{display:none;margin-top:14px;padding:14px 16px;background:#FFF8F4;border-radius:14px}
.otherwrap.show{display:block;animation:fade .2s ease}
.otherwrap label{font-weight:700;font-size:15px;display:block;margin-bottom:8px}
.othertxt{width:100%;font:inherit;padding:10px 14px;border:2px solid #E6D3C8;border-radius:12px;background:#fff;color:#1F2A37}
.faces{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.faces.three{grid-template-columns:repeat(3,1fr);max-width:420px}
.face{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border:2px solid #DDD6C8;border-radius:16px;font-size:14px;text-align:center;background:#fff}
.face:hover{border-color:#CFE3DF}
.face.on{border-color:#2F6F6B;box-shadow:inset 0 0 0 1.5px #2F6F6B;background:#E8F2F0;font-weight:700}
.face .mk{display:none}
.goal{border-left:6px solid #2F6F6B;background:#F3F8F7;border-radius:14px;padding:14px 18px;margin-bottom:20px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.goal .gl{font-size:13px;font-weight:700;text-transform:uppercase;color:#2F6F6B;letter-spacing:.06em}
.goal .gt{font-family:'Lexend',sans-serif;font-size:20px;font-weight:500;margin-top:2px}
.sub + .sub{margin-top:22px;padding-top:20px;border-top:1px solid #EEE9DE}
.sup,.stmt{padding:16px 0;border-top:1px solid #EEE9DE}
.sup.first,.stmt.first{border-top:0;padding-top:4px}
.sup .sn,.stmt .sn{font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.sup .speak,.stmt .speak{width:34px;height:34px}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.side{display:flex;align-items:center;justify-content:center;text-align:center;padding:18px 14px;border:2px solid #DDD6C8;border-radius:16px;background:#fff;font-weight:700;min-height:84px}
.side:hover{border-color:#9CC3BD}
.side.on{background:#2F6F6B;border-color:#2F6F6B;color:#fff}
.side .mk{display:none}
.or{align-self:center;font-family:'Lexend',sans-serif;font-weight:700;color:#C2694A;font-size:14px;width:38px;height:38px;border-radius:50%;background:#FBEDE6;display:grid;place-items:center}
.both{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:10px 0 0}
.pairwrap + .pairwrap{margin-top:22px;padding-top:20px;border-top:1px solid #EEE9DE}
textarea{width:100%;min-height:96px;border:2px solid #DDD6C8;border-radius:14px;padding:12px 14px;font:inherit;background:#FDFCF9;resize:vertical;color:#1F2A37;display:block}
textarea:focus,.othertxt:focus{outline:none;border-color:#2F6F6B;box-shadow:0 0 0 4px rgba(47,111,107,.15)}
.mic{margin-top:8px;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:2px solid #D9E7E4;background:#F1F7F6;color:#2F6F6B;font-family:'Lexend',sans-serif;font-weight:600;font-size:15px;cursor:pointer}
.mic:hover{background:#E1EFEC}
.mic.live{background:#C2694A;border-color:#C2694A;color:#fff;animation:pulse 1.3s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(194,105,74,.45)}70%{box-shadow:0 0 0 12px rgba(194,105,74,0)}100%{box-shadow:0 0 0 0 rgba(194,105,74,0)}}
.printbox,.printhead{display:none}
.follow{display:none;margin-top:14px;padding:14px 16px;border-radius:14px;background:#FBEDE6}
.follow.show{display:block;animation:fade .2s ease}
.follow .fl{font-weight:700;display:block;margin-bottom:10px;font-size:16px}
.follow .sub-l{font-weight:700;display:block;margin:14px 0 8px;font-size:15px;color:#4A5563}
.follow textarea{min-height:72px;background:#fff}
.sup .follow{margin-top:12px;padding:12px 14px}
.card.stack{background:transparent;box-shadow:none;padding:0}
.card.stack>.qhead{padding:0 2px}
.card.stack>.hint{padding:0 2px;margin-bottom:18px}
.card.stack .sup,.card.stack .stmt,.card.stack .pairwrap{background:#fff;border:1px solid #E4DED2;border-left:6px solid #E3DDCF;border-radius:18px;padding:20px 22px 22px;margin:0 0 20px;box-shadow:0 1px 2px rgba(31,42,55,.07),0 8px 24px rgba(31,42,55,.07);transition:border-color .2s}
.card.stack .pairwrap + .pairwrap{margin-top:0;padding-top:20px;border-top:1px solid #E4DED2}
.card.stack .answered{border-left-color:#2F6F6B!important}
.cnt{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8A94A0;margin-bottom:2px}
.pairwrap .cnt{margin-bottom:10px}
.sup .sn>span:first-child{min-width:0}
.sup .follow .fl{font-size:15px;margin-bottom:8px}
nav.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(240,235,225,.96);backdrop-filter:blur(8px);border-top:1px solid #E6E0D3;z-index:5}
.navin{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;justify-content:space-between;gap:12px}
.btn{font-family:'Lexend',sans-serif;font-size:17px;font-weight:600;border-radius:999px;padding:13px 26px;border:2px solid #2F6F6B;cursor:pointer}
.btn.primary{background:#2F6F6B;color:#fff}
.btn.primary:hover{background:#265B58}
.btn.ghost{background:transparent;color:#2F6F6B}
.btn[hidden]{display:none}
.hero{padding:10px 0 4px}
.hero h1{font-size:42px;margin:6px 0 10px;font-weight:700}
.hero p{font-size:19px;color:#3D4855;margin:0 0 18px}
.facts{list-style:none;margin:20px 0;padding:0;display:flex;flex-direction:column;gap:12px}
.facts li{display:flex;gap:12px;align-items:flex-start;font-size:17px;color:#3D4855}
.fi{flex:none;width:34px;height:34px;border-radius:50%;background:rgba(47,111,107,.1);color:#2F6F6B;display:grid;place-items:center}
body.home .fi{background:rgba(62,107,79,.12);color:#3E6B4F}
body.class .fi{background:rgba(46,74,110,.12);color:#2E4A6E}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}
.mini{background:#fff;border-radius:16px;padding:16px 12px;text-align:center;font-size:15px;color:#4A5563;box-shadow:0 1px 2px rgba(31,42,55,.06)}
.mini b{display:block;font-family:'Lexend',sans-serif;font-size:17px;color:#2F6F6B;margin-bottom:2px}
details.adult{background:#fff;border-radius:16px;padding:14px 18px;border:2px dashed #DDD6C8;font-size:16px}
details.adult summary{cursor:pointer;font-weight:700;color:#2F6F6B}
details.adult ul{margin:10px 0 2px;padding-left:20px}
details.adult li{margin-bottom:6px}
.donehero{text-align:center;padding:10px 0 14px}

const BRAND = { name: "ECHO", tagline: "Student voices matter" };
let S = null, PR = null, MODE = 'student', CM = null, TCH = null, LAST = '', sentTapped = false;
const app = document.getElementById('app');
const registry = [];
const speakOK = 'speechSynthesis' in window;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let voiceOK = false;
let uid = 0, cur = 0, started = false, done = false, rec = null;
const SPK = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>';
const MIC = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>';
const ICO=d=>'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+d+'</svg>';
const CLOCK=ICO('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),SKIPI=ICO('<path d="M5 12h14"/><path d="M13 6l6 6-6 6"/>'),SENDI=ICO('<path d="M4 12l16-8-6 16-3-7-7-1z"/>'),STARI=ICO('<path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/>');
const LOCK = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';

function logo(sz,anim){const a=anim?[' class="r1"',' class="r2"',' class="r3"']:['','',''];const o=' fill="none" stroke="#CF6B3B" stroke-width="7" stroke-linecap="round"';return '<svg viewBox="0 0 64 64" width="'+sz+'" height="'+sz+'" aria-hidden="true"><path d="M31.43 4.86 A24.89 24.89 0 1 0 33.15 54.34" fill="none" stroke="#0F4D48" stroke-width="8"/><path d="M12.44 47.29 L24.53 53.33 L7.11 62.76 Z" fill="#0F4D48" stroke="#0F4D48" stroke-width="1.5" stroke-linejoin="round"/><path'+a[0]+' d="M29.87 23.64 A11.12 11.12 0 0 1 29.51 41.42"'+o+'/><path'+a[1]+' d="M37.69 15.64 A21.34 21.34 0 0 1 38.76 48.36"'+o+'/><path'+a[2]+' d="M43.56 7.11 A26.90 26.90 0 0 1 45.87 54.22"'+o+'/></svg>';}
function lockup(sz,tag){return '<div class="lockup">'+logo(sz,true)+'<div><div class="wm">'+BRAND.name+'</div><div class="tl">'+(tag||(ADULT()?(MT[MODE]).tag:BRAND.tagline))+'</div></div></div>';}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function lowerFirst(s){return /^I\b/.test(s)?s:s.charAt(0).toLowerCase()+s.slice(1);}
function fill(t,x){const m=Object.assign({S:S.student,s:S.student,he:PR.he,him:PR.him,his:PR.his,He:cap(PR.he),His:cap(PR.his)},x||{});return String(t).replace(/\{(\w+)\}/g,(z,k)=>(k in m)?m[k]:z);}
function listJoin(a){return a.length<2?(a[0]||''):a.length===2?a[0]+' and '+a[1]:a.slice(0,-1).join(', ')+', and '+a[a.length-1];}
function qa(v,isOpt,period){let t=String(v).trim().replace(/\s+/g,' ');if(isOpt)t=lowerFirst(t);else t=t.charAt(0).toUpperCase()+t.slice(1);if(period!==false&&!/[.!?]$/.test(t))t+='.';return '"'+t+'"';}
function optKid(o){return Array.isArray(o)?o[0]:o;}
function optNarr(o){return Array.isArray(o)?fill(o[1]):lowerFirst(o);}
function checked(n){return [...document.querySelectorAll('input[name="'+n+'"]:checked')].map(i=>i.value);}
function textv(k){const t=document.querySelector('textarea[data-key="'+k+'"]');return t?t.value.trim():'';}
function otherv(k){const o=document.querySelector('input[data-other="'+k+'"]');return o?o.value.trim():'';}

function grp(role,label){return ' role="'+role+'" aria-label="'+esc(label)+'"';}
function speakBtn(t){return speakOK?'<button type="button" class="speak" aria-label="'+esc('Read aloud: '+String(t).slice(0,90))+'" data-say="'+esc(t)+'">'+SPK+'</button>':'';}
function micBtn(attr,key){return voiceOK?'<button type="button" class="mic" data-'+attr+'="'+key+'">'+MIC+'<span>Say it instead</span></button>':'';}
function qhead(t,h){t=fill(t);if(h)h=fill(h);return '<div class="qhead"><h3>'+esc(t)+'</h3>'+speakBtn(t)+'</div>'+(h?'<p class="hint">'+esc(h)+'</p>':'');}
function opt(name,value,label,type,cls){uid+=1;const id='o'+uid;return '<label class="opt '+(cls||'chip')+'" for="'+id+'"><input type="'+type+'" id="'+id+'" name="'+name+'" value="'+esc(value)+'"><span class="mk '+type+'"></span><span>'+esc(label)+'</span></label>';}
function ta(key,ph,label){return '<textarea data-key="'+key+'" aria-label="'+esc(label||ph||'Your answer')+'" placeholder="'+esc(ph||'Type here, or tap Say it instead.')+'"></textarea>'+micBtn('tk',key)+'<div class="printbox" data-mirror="'+key+'"></div>';}
function face(n){const my=[0,22,27,31,35,40][n];const f=['','#E8957C','#F7D2AE','#F1ECDD','#CDE5D3','#8CCAB0'];const brows=n===1?'<path d="M13 16.5 L20 13.5 M35 16.5 L28 13.5" stroke="#1F2A37" stroke-width="2.2" stroke-linecap="round"/>':'';return '<svg viewBox="0 0 48 48" width="44" height="44" aria-hidden="true"><circle cx="24" cy="24" r="21" fill="'+f[n]+'" stroke="#1F2A37" stroke-width="2"/>'+brows+'<circle cx="17" cy="21" r="2.4" fill="#1F2A37"/><circle cx="31" cy="21" r="2.4" fill="#1F2A37"/><path d="M15 32 Q24 '+my+' 33 32" fill="none" stroke="#1F2A37" stroke-width="2.4" stroke-linecap="round"/></svg>';}
function follow(names,fu,sec,label){
 const base=names[0];
 registry.push({sec,label:label||'Tell me more',key:base,kind:'follow',main:false});
 let h='<div class="follow" data-names="'+names.join('|')+'" data-when="'+esc(JSON.stringify(fu.when))+'"><span class="fl">'+esc(fu.prompt)+'</span>';
 if(fu.cols){const col=(t,cls,arr)=>'<div class="hcol '+cls+'"'+grp('group',t)+'><div class="hcol-h">'+t+'</div>'+arr.map(o=>opt(base+'_more',optKid(o),optKid(o),'checkbox','chip small')).join('')+'</div>';
  h+='<div class="hcols">'+col('What\'s been hard','hard',fu.cols.hard)+col('What\'s going well','good',fu.cols.good)+'</div><span class="sub-l">'+esc(fu.textPrompt||'Anything else?')+'</span>';}
 else if(fu.options){h+='<div class="chips"'+grp('group',fu.prompt)+'>'+fu.options.map(o=>opt(base+'_more',optKid(o),optKid(o),'checkbox','chip small')).join('')+'</div><span class="sub-l">'+esc(fu.textPrompt||'Anything else?')+'</span>';}
 return h+ta(base+'_mtxt','A few words is fine.',fu.options?(fu.textPrompt||'Anything else?'):fu.prompt)+'</div>';
}

function renderItem(it,sec){
 let h='';
 if(it.type==='checklist'){
  registry.push({sec,label:it.q,key:it.id,kind:'check',main:true});
  h+=qhead(it.q,it.hint)+'<div class="chips"'+grp('group',it.q)+'>'+it.options.map(o=>opt(it.id,optKid(o),optKid(o),'checkbox')).join('')+(it.other?opt(it.id,'__other','Something else','checkbox','chip add'):'')+'</div>';
  if(it.other) h+='<div class="otherwrap" data-ow="'+it.id+'"><label>'+esc(it.otherPrompt||'Tell us what it is:')+'</label><input class="othertxt" data-other="'+it.id+'" aria-label="'+esc(it.otherPrompt||'Something else')+'" placeholder="Type it here">'+micBtn('ok',it.id)+'</div>';
 } else if(it.type==='text'){
  registry.push({sec,label:it.q,key:it.id,kind:'text',main:true});
  h+=qhead(it.q,it.hint)+ta(it.id,null,it.q);
 } else if(it.type==='scale'){
  registry.push({sec,label:it.q,key:it.id,kind:'radio',main:true});
  const k2=S.band==='K-2';
  const lv=k2?[[1,'Hard'],[3,'Okay'],[5,'Good']]:[[1,'Really hard'],[2,'Hard'],[3,'Okay'],[4,'Good'],[5,'Really good']];
  h+=qhead(it.q,it.hint)+'<div class="faces'+(k2?' three':'')+'"'+grp('radiogroup',it.q)+'>'+lv.map(([n,l])=>{uid+=1;const id='o'+uid;return '<label class="opt face" for="'+id+'"><input type="radio" id="'+id+'" name="'+it.id+'" value="'+esc(l)+'"><span class="mk radio"></span>'+face(n)+'<span>'+esc(l)+'</span></label>';}).join('')+'</div>';
  if(it.followUp) h+=follow([it.id],it.followUp,sec);
 } else if(it.type==='choice'){
  registry.push({sec,label:it.q,key:it.id,kind:'radio',main:true});
  h+=qhead(it.q,it.hint)+'<div class="chips"'+grp('radiogroup',it.q)+'>'+it.options.map(o=>opt(it.id,o,o,'radio')).join('')+'</div>';
  if(it.followUp) h+=follow([it.id],it.followUp,sec);
 } else if(it.type==='supports'){
  h+=qhead(it.q,it.hint);
  const names=[];
  it.rows.forEach((r,i)=>{const n=it.id+'_'+i;names.push(n);registry.push({sec,label:r.k,key:n,kind:'radio',main:true});
   h+='<div class="sup'+(i===0?' first':'')+'"><div class="sn"><span><span class="cnt">'+(i+1)+' of '+it.rows.length+'</span>'+esc(r.k)+'</span>'+speakBtn(r.k)+'</div><div class="chips"'+grp('radiogroup',r.k)+'>'+it.options.map((o,j)=>opt(n,o,o,'radio','chip small'+(j===it.options.length-1?' unsure':''))).join('')+'</div>'
    +(it.followUp?follow([n],{when:it.followUp.when,prompt:it.followUp.prompt},sec,'More about this one'):'')+'</div>';});
 } else if(it.type==='pairs'){
  h+=qhead(it.q,it.hint);
  it.pairs.forEach((p,i)=>{const n=it.id+'_'+i;registry.push({sec,label:p.a+' or '+p.b,key:n,kind:'radio',main:true});
   h+='<div class="pairwrap"'+grp('radiogroup',p.a+' or '+p.b)+'><span class="cnt">'+(i+1)+' of '+it.pairs.length+'</span><div class="pair">'+opt(n,p.a,p.a,'radio','side')+'<div class="or">or</div>'+opt(n,p.b,p.b,'radio','side')+'</div><div class="both">'+opt(n,'Both are okay','Both are okay','radio','chip small')+opt(n,'Neither works for me','Neither works for me','radio','chip small')+'</div></div>';});
 } else if(it.type==='ync'){
  h+=qhead(it.q,it.hint);
  it.statements.forEach((st,i)=>{const n=it.id+'_'+i;registry.push({sec,label:st.s,key:n,kind:'radio',main:true});

function narrFollow(it,v,out){
 const fu=it.followUp;if(!fu||!fu.when.includes(v))return;

 const fv=checked(it.id+'_more');
 if(fu.cols){const gset=new Set(fu.cols.good.map(o=>optKid(o)));const hv=fv.filter(x=>!gset.has(x)),gv=fv.filter(x=>gset.has(x));
  if(hv.length)out.push(fill(fu.narr,{list:listJoin(hv.map(x=>map[x]||lowerFirst(x)))}));
  if(gv.length)out.push(fill(hv.length?fu.goodNarr:'At home, the parent noticed positive signs: {list}.',{list:listJoin(gv.map(x=>map[x]||lowerFirst(x)))}));}
 else if(fv.length&&fu.narr) out.push(fill(fu.narr,{list:listJoin(fv.map(x=>map[x]||lowerFirst(x)))}));
 const ft=textv(it.id+'_mtxt');
 if(ft) out.push(fill(fu.textNarr||'{He} added, {a}',{a:qa(ft,false)}));
}
function narrItem(it,out){
 const t=it.type;
 if(t==='note')return;
 if(t==='supports3'){
  const skip=[];
  it.rows.forEach((r,i)=>{const n=it.id+'_'+i,x=fill(r.n);const v={};it.dims.forEach(d=>{v[d.k]=checked(n+'_'+d.k)[0];});const c=textv(n+'_c');
   if(!v.f&&!v.n&&!v.a&&!c){skip.push(x);return;}
   const NC={'Minimal need':'{S} had minimal need for it','Sometimes helpful':'it was sometimes helpful','Highly reliant':'{S} was highly reliant on it'};
   const cl=[];if(v.n)cl.push(fill(NC[v.n]||('need was '+lowerFirst(v.n))));if(v.a)cl.push(fill('{his} attitude toward it was ')+lowerFirst(v.a).replace(' / ',' or '));
   const tail=cl.length?(cl[0]+(cl[1]?', and '+cl[1]:'')):'';
   if(v.f)out.push('The teacher reported that '+x+' was provided '+lowerFirst(v.f)+(tail?', and that '+tail:'')+'.');
   else if(tail)out.push('For '+x+', the teacher reported that '+tail+'.');
   if(c)out.push('About '+x+', the teacher said, '+qa(c,false));});
  if(skip.length)out.push('The teacher did not rate '+listJoin(skip)+'.');
  return;
 }
 if(t==='goal'){it.items.forEach(s=>narrItem(s,out));return;}
 if(t==='checklist'){
  const v=checked(it.id);if(!v.length)return;
  const map={};it.options.forEach(o=>{map[optKid(o)]=optNarr(o);});
  const items=v.map(x=>{if(x==='__other'){const o=otherv(it.id);return o?fill(it.otherNarr||'something {he} described as ')+'"'+o+'"':'something else';}return map[x]||lowerFirst(x);});
  out.push(fill(it.narr,{list:listJoin(items),things:items.length>1?'things':'something'}));return;
 }
 if(t==='text'){const v=textv(it.id);if(v)out.push(fill(it.narr,{a:qa(v,false)}));return;}
 if(t==='scale'||t==='choice'){const v=checked(it.id)[0];if(!v)return;out.push(fill(it.narr,{a:qa(v,true)}));narrFollow(it,v,out);return;}
 if(t==='supports'){
  const g=it.options.map(()=>[]),skip=[];
  it.rows.forEach((r,i)=>{const v=checked(it.id+'_'+i)[0];const n=fill(r.n);if(!v){skip.push(n);return;}g[it.options.indexOf(v)].push(n);});
  g.forEach((arr,j)=>{if(arr.length)out.push(fill(it.optNarr[j],{list:listJoin(arr)}));});
  if(it.followUp) it.rows.forEach((r,i)=>{const v=checked(it.id+'_'+i)[0],ft=textv(it.id+'_'+i+'_mtxt');
   if(ft&&it.followUp.when.includes(v)) out.push(fill(it.followUp.rowNarr||'When asked about {x}, {he} said, {a}',{x:fill(r.n),a:qa(ft,false)}));});
  if(skip.length&&it.skipNarr) out.push(fill(it.skipNarr,{list:listJoin(skip)}));
  return;
 }
 if(t==='pairs'){
  const s=[];
  it.pairs.forEach((p,i)=>{const v=checked(it.id+'_'+i)[0];if(!v)return;const x=fill(p.an),y=fill(p.bn);
   if(v===p.a)s.push(fill('{He} preferred {x} over {y}.',{x,y}));
   else if(v===p.b)s.push(fill('{He} preferred {y} over {x}.',{x,y}));
   else if(v==='Neither works for me')s.push(fill('{He} said neither {x} nor {y} worked well for {him}.',{x,y}));
   else s.push(fill('{He} said both {x} and {y} were okay with {him}.',{x,y}));});
  if(s.length){out.push(fill(it.narrLead));s.forEach(z=>out.push(z));}
  return;
 }
 if(t==='ync'){
  const groups={},order=[];
  it.statements.forEach((st,i)=>{const v=checked(it.id+'_'+i)[0];if(!v)return;if(!groups[v]){groups[v]=[];order.push(v);}groups[v].push(fill(st.n));});
  order.forEach((v,j)=>out.push(fill((j?(it.whoNext||'{He}'):(it.whoFirst||'{S}'))+' answered {a} when asked {list}.',{a:qa(v,true,false),list:listJoin(groups[v])})));
 }
}

   +stp(2,'st4','Start the survey','About 10 to 15 minutes, mostly tapping. At the end, you tap Send to email your answers.','<button type="button" class="btn primary" id="goBtn">Start</button><div class="msg" id="setupMsg" aria-live="polite"></div>');
 } else if(mode==='teacher'){
  h+='<p class="intro">'+esc(cmName().charAt(0).toUpperCase()+cmName().slice(1))+' would like your classroom view of a student before the next IEP meeting.</p>'
   +stp(1,'st0','About you','So the team knows whose view this is.','<div class="prow" style="margin:0"><input class="inp" id="tName" maxlength="40" placeholder="Your name (e.g., Ms. Johnson)" aria-label="Your name"><input class="inp" id="tClass" maxlength="50" placeholder="Class or subject (e.g., 7th grade math)" aria-label="Class or subject"></div>')
   +stp(2,'st3','The student\'s name','','<div class="prow" style="margin:0"><input class="inp" id="fname" autocomplete="off" maxlength="30" placeholder="First name" aria-label="Student first name"><input class="inp" id="lname" autocomplete="off" maxlength="30" placeholder="Last name (optional)" aria-label="Student last name, optional"></div><p class="fine">The first name fills in the questions. The last name only labels your answers. Nothing is saved on this page.</p>')
   +stp(3,'st4','Start the survey','About 10 to 15 minutes, mostly tapping. At the end, you send your answers by email.','<button type="button" class="btn primary" id="goBtn">Start</button><div class="msg" id="setupMsg" aria-live="polite"></div>');
 } else if(mode==='link'){
  h+='<p class="intro">A short survey made from '+(loaded.grade?'a '+esc(loaded.grade)+' student\'s':'the student\'s')+' IEP, so their voice is part of the meeting.</p>'
   +'<div class="ready" style="margin:0 0 12px">'+CHECK+'Survey loaded from your link</div>'
   +stp(1,'st3','Add the student\'s first name','',name)
   +stp(2,'st4','Start the survey','Then hand the device to the student.',go);

   +(location.protocol==='file:'?'<div class="msg bad" style="margin:0 0 12px">You are using a downloaded copy of ECHO. Survey links made here only work on this computer and may not paste as links. To send surveys, open ECHO from its web address.</div>':'')
   +stp(3,'st3x','Share the surveys','Three people can weigh in: the student, a parent or guardian, and teachers. Send to any or all of them; each gets a version written for them.',
     '<div class="ctx"><div class="field" style="margin:0 0 6px">Fill in once. These details are used for every survey you send.</div><div class="prow" style="margin:0"><input class="inp" id="cmName" maxlength="40" placeholder="Case manager name (e.g., Ms. Rivera)" aria-label="Case manager name"><input class="inp" id="cmEmail" type="email" maxlength="80" placeholder="Case manager email" aria-label="Case manager email"></div>'
     +'<div class="prow" style="margin:10px 0 0"><input class="inp" id="fname" autocomplete="off" maxlength="30" placeholder="Student first name" aria-label="Student first name"><input class="inp" id="lname" autocomplete="off" maxlength="30" placeholder="Student last name (optional)" aria-label="Student last name, optional"></div>'

     +'<div class="who"><div class="whoh"><span class="wdot fam"></span>Parent/guardian</div><p class="fine" style="margin:0 0 10px">A home version in plain language. Works on a phone.</p>'

     +'<div class="who"><div class="whoh"><span class="wdot tch"></span>Teacher</div><p class="fine" style="margin:0 0 10px">A classroom version for general education teachers. Send one to each teacher; each adds their own name.</p>'

   +'<div class="center"><button type="button" class="textlink" id="sampleBtn">Just exploring? Try a sample survey</button></div>';
 }
 w.innerHTML=h;

function pasteKeys(){return /Mac/.test(navigator.platform||'')?'Cmd + V':'Ctrl + V';}
function buildEmail(kind,link,cmN,o){
 const nm=cleanName((document.getElementById('fname')||{}).value||''),ln=cleanName((document.getElementById('lname')||{}).value||''),full=(nm+(ln?' '+ln:'')).trim(),fullP=full?full+'\'s':'';
 const kid=nm||'the student',kidP=nm?nm+'\'s':'the student\'s',child=nm||'your child',childP=nm?nm+'\'s':'your child\'s';
 const sign=cmN||'';
 let subj,paras,cta;
 if(kind==='parent'){subj='Your thoughts before '+(fullP||childP)+' IEP meeting';
  paras=['Hello,',childP.charAt(0).toUpperCase()+childP.slice(1)+' IEP team will be meeting soon, and we would love to hear your thoughts first. This short survey takes about 10 to 15 minutes, works on a phone or computer, and asks how this year has gone at home and at school.','[LINK]','When you finish, the survey helps you send your answers to me by email. Nothing is saved online.'];
  cta='Click HERE to begin the survey.';}
 else if(kind==='teacher'){subj='Classroom input for '+(fullP||kidP)+' IEP meeting';
  paras=['Hi,','Before '+kidP+' upcoming IEP meeting, I would appreciate your view from the classroom. This short survey takes about 10 to 15 minutes and asks about progress on IEP goals, supports in your class, and how '+kidP+' needs affect access and progress in general education.','[LINK]','When you finish, your answers come back to me by email. Nothing is saved online.'];
  cta='Click HERE to begin the survey.';}
 else {subj='Student input survey for '+(fullP||kidP)+' IEP meeting';
  paras=['Hi,','Here is the student input survey for '+kidP+' upcoming IEP meeting. It takes about 10 minutes, and most questions just need a tap.','[LINK]','Type '+(nm?nm+'\'s':'the student\'s')+' first name, then hand over the device. At the end, click Create summary, then save the PDF or copy the summary and send it to me.'];
  cta='Click HERE to open the survey.';}
 paras.push('Thank you,'+(sign?'\n'+sign:''));
 const he=t=>t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 const html=paras.map(p=>p==='[LINK]'?'<p><b><a href="'+he(link)+'">'+he(cta.replace('HERE','here'))+'</a></b></p>':'<p>'+he(p).replace(/\n/g,'<br>')+'</p>').join('');
 const text=paras.map(p=>p==='[LINK]'?cta.replace('Click HERE to','To')+' open this link:\n'+link:p).join('\n\n');
 return {subj,html,text};
}
function copyPlain(t,outId,msgId,ok){const out=document.getElementById(outId);
 (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{msg(msgId,'ok',ok);out.classList.remove('show');})
 .catch(()=>{out.value=t;out.classList.add('show');out.focus();out.select();msg(msgId,'bad','Copying was blocked. Select the text below and copy it.');});}
function copyRich(em,outId,msgId,ok){const out=document.getElementById(outId);
 let p;try{p=(window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write)?navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([em.html],{type:'text/html'}),'text/plain':new Blob([em.text],{type:'text/plain'})})]):Promise.reject();}catch(e){p=Promise.reject();}
 p.then(()=>{msg(msgId,'ok',ok);out.classList.remove('show');})
 .catch(()=>{(navigator.clipboard?navigator.clipboard.writeText(em.text):Promise.reject()).then(()=>{msg(msgId,'ok',ok);out.classList.remove('show');})
  .catch(()=>{out.value=em.text;out.classList.add('show');out.focus();out.select();msg(msgId,'bad','Copying was blocked. Select the email below and copy it.');});});}
function msg(id,cls,t){const e=document.getElementById(id);if(e){e.className='msg '+cls;e.textContent=t;}}
function readPacketBox(){
 const box=document.getElementById('packet');if(!box)return loaded;
 const alt=document.getElementById('linkAlt');
 if(!box.value.trim()){msg('packetMsg','bad','Paste the AI\'s reply first.');markStep('st2',false);if(alt)alt.hidden=true;return null;}
 try{loaded=parsePasted(box.value);msg('packetMsg','ok','Survey ready: '+loaded.sections.length+' parts'+(loaded.grade?', '+loaded.grade:'')+'.');markStep('st2',true);if(alt)alt.hidden=false;return loaded;}
 catch(e){loaded=null;markStep('st2',false);if(alt)alt.hidden=true;msg('packetMsg','bad',e.friendly?e.message:'That reply did not load. Copy the AI\'s whole reply again.');return null;}
}
document.getElementById('setupWrap').addEventListener('input',e=>{if(e.target.id==='packet'){const v=e.target.value.trim();if(v.length>20&&v.lastIndexOf('}')>0)readPacketBox();else{msg('packetMsg','','');markStep('st2',false);}}
 if(e.target.id==='fname')markStep('st3',!!cleanName(e.target.value));});
document.getElementById('setupWrap').addEventListener('keydown',e=>{if(e.target.id==='fname'&&e.key==='Enter'){e.preventDefault();document.getElementById('goBtn').click();}});
document.getElementById('setupWrap').addEventListener('click',async e=>{
 const id=(e.target.closest('button')||{}).id;
 if(id==='goBtn'){const o=readPacketBox();if(!o)return;const n=cleanName(document.getElementById('fname').value);
  if(MODE==='teacher'){const tn=(document.getElementById('tName').value||'').replace(/\s+/g,' ').trim().slice(0,40),tc=(document.getElementById('tClass').value||'').replace(/\s+/g,' ').trim().slice(0,50);
   if(!tn){msg('setupMsg','bad','Add your name so the team knows whose view this is.');document.getElementById('tName').focus();return;}TCH={n:tn,c:tc};}
  if(!n){msg('setupMsg','bad',MODE==='parent'?'Type your child\'s first name to begin.':'Type the student\'s first name to begin.');document.getElementById('fname').focus();return;}
  LAST=ADULT()?cleanName((document.getElementById('lname')||{}).value||''):'';
  startSurvey(o,n);}
 if(id==='promptBtn'){const out=document.getElementById('promptOut');
  (navigator.clipboard?navigator.clipboard.writeText(AI_PROMPT):Promise.reject()).then(()=>{msg('promptMsg','ok','Prompt copied. Paste it into your AI tool.');markStep('st1',true);out.classList.remove('show');})
   .catch(()=>{out.value=AI_PROMPT;out.classList.add('show');out.focus();out.select();msg('promptMsg','bad','Copying was blocked. Select the text below and copy it.');markStep('st1',true);});}
 if(id==='sampleBtn'){const n=cleanName((document.getElementById('fname')||{}).value||'')||'Wally';startSurvey(checkPacket(JSON.parse(JSON.stringify(SAMPLE))),n);}
 if(['parentBtn','teacherBtn','parentRaw','teacherRaw'].indexOf(id)>=0){const o=readPacketBox();if(!o)return;const tch=id.indexOf('teacher')===0,mid=tch?'teacherMsg':'parentMsg',oid=tch?'teacherOut':'parentOut';
  const nm=(document.getElementById('cmName').value||'').trim().slice(0,40),em=(document.getElementById('cmEmail').value||'').trim();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){msg(mid,'bad','Add the case manager\'s email at the top of Step 3 so the answers have somewhere to go.');document.getElementById('cmEmail').focus();return;}
  const cm=b64u(new TextEncoder().encode(JSON.stringify({n:nm,e:em})));
  const link=location.href.split('#')[0]+'#s='+(await encodePacket(o._raw||o))+'&m='+(tch?'t':'p')+'&cm='+cm;
  if(id.slice(-3)==='Raw'){copyPlain(link,oid,mid,(tch?'Teacher':'Parent/guardian')+' survey link copied.');return;}
  const em2=buildEmail(tch?'teacher':'parent',link,nm,o);
  copyRich(em2,oid,mid,(tch?'Teacher':'Parent/guardian')+' email copied. Open a new email, click in the message, paste ('+pasteKeys()+'), add the subject "'+em2.subj+'", review it, and send.');}
 if(id==='linkBtn'||id==='linkRaw'){const o=readPacketBox();if(!o)return;
  const link=location.href.split('#')[0]+'#s='+(await encodePacket(o._raw||o));
  if(id==='linkRaw'){copyPlain(link,'linkOut','linkMsg','Student survey link copied.');return;}
  const nm=(document.getElementById('cmName').value||'').trim().slice(0,40);
  const em2=buildEmail('student',link,nm,o);
  copyRich(em2,'linkOut','linkMsg','Staff email copied. Open a new email to the adult giving the survey, paste ('+pasteKeys()+'), add the subject "'+em2.subj+'", review it, and send.');}
});
(async function init(){
 document.getElementById('brandLogo').innerHTML=logo(28,false);
 document.getElementById('brandTitle').textContent=BRAND.name;
 const m=location.hash.match(/[#&]s=([A-Za-z0-9_-]+)/);
 const tm=/[#&]m=t(&|$)/.test(location.hash);
 if(m&&tm){const cmt=location.hash.match(/[#&]cm=([A-Za-z0-9_-]+)/);try{loaded=await decodePacket(m[1]);MODE='teacher';try{CM=JSON.parse(new TextDecoder().decode(unb64u(cmt[1])));}catch(e){CM=null;}document.title='ECHO Classroom Survey';document.body.classList.add('class');renderSetup('teacher');return;}catch(e){renderSetup('paste','This survey link did not open correctly. Please ask the case manager for a new link.');return;}}
 const pm=/[#&]m=p(&|$)/.test(location.hash),cmm=location.hash.match(/[#&]cm=([A-Za-z0-9_-]+)/);
 if(m&&pm){try{loaded=await decodePacket(m[1]);MODE='parent';try{CM=JSON.parse(new TextDecoder().decode(unb64u(cmm[1])));}catch(e){CM=null;}document.title='ECHO Home Survey';document.body.classList.add('home');renderSetup('parent');return;}catch(e){renderSetup('paste','This survey link did not open correctly. Please ask the school for a new link.');return;}}
 if(m){try{loaded=await decodePacket(m[1]);renderSetup('link');return;}
  catch(e){renderSetup('paste','This survey link did not open correctly. Ask for a new link, or build the survey below.');return;}}
 renderSetup('paste');
})();
