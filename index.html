<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECHO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#F6F3EC;color:#1F2A37;font-family:'Atkinson Hyperlegible',system-ui,sans-serif;font-size:18px;line-height:1.5}
h1,h2,h3{font-family:'Lexend',system-ui,sans-serif;color:#1F2A37}
header.top{position:sticky;top:0;z-index:5;background:rgba(246,243,236,0.94);backdrop-filter:blur(8px);border-bottom:1px solid #E6E0D3}
.topin{max-width:760px;margin:0 auto;padding:12px 16px}
.brand{display:flex;justify-content:space-between;align-items:center;font-family:'Lexend',sans-serif;font-weight:600;font-size:15px;color:#2F6F6B}
.brandmark{display:inline-flex;align-items:center;gap:7px;letter-spacing:.03em;font-weight:800;color:#0F4D48;font-size:17px}
.brandmark svg{display:block}
.lockup{display:flex;align-items:center;gap:4px;margin-bottom:22px}
.lockup .wm{font-family:'Lexend',sans-serif;font-weight:800;font-size:46px;letter-spacing:.01em;color:#0F4D48;line-height:.95}
.lockup .tl{font-family:'Lexend',sans-serif;font-size:12.5px;letter-spacing:.2em;color:#CF6B3B;font-weight:700;margin-top:7px;text-transform:uppercase}
@keyframes rp{0%{opacity:.5}35%{opacity:1}100%{opacity:.5}}
.lockup .r1{animation:rp 2.6s ease-in-out infinite}
.lockup .r2{animation:rp 2.6s ease-in-out .35s infinite}
.lockup .r3{animation:rp 2.6s ease-in-out .7s infinite}
@media (prefers-reduced-motion:reduce){.lockup .r1,.lockup .r2,.lockup .r3{animation:none}}
body.setup .steps,body.setup .steplabel,body.setup nav.bottom,body.setup main{display:none}
#setupWrap{max-width:760px;margin:0 auto;padding:24px 16px 60px}
body:not(.setup) #setupWrap{display:none}
#setupWrap h2{font-size:26px;margin:0 0 6px}
#setupWrap .lead{color:#4A5563;margin:0 0 4px}
.field{display:block;font-weight:700;margin:18px 0 8px}
.inp{width:100%;font:inherit;padding:12px 14px;border:2px solid #DDD6C8;border-radius:12px;background:#FDFCF9;color:#1F2A37}
.inp:focus{outline:none;border-color:#2F6F6B;box-shadow:0 0 0 4px rgba(47,111,107,.15)}
#packet{min-height:130px;font-size:15px}
.fine{font-size:14px;color:#6B7280;margin:6px 0 0}
.msg{min-height:22px;font-size:15px;font-weight:700;margin-top:10px}
.msg.ok{color:#2F6F6B}.msg.bad{color:#B4583A}
.ready{display:flex;gap:10px;align-items:center;background:#E8F2F0;border-radius:12px;padding:10px 14px;font-weight:700;color:#1F5A4E;margin:12px 0 0}
.setupgo{margin-top:20px}
.textlink{background:none;border:0;color:#2F6F6B;font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:4px}
.center{text-align:center;margin-top:6px}
#linkOut,#promptOut{display:none;margin-top:10px;min-height:80px;font-size:13px}
#linkOut.show,#promptOut.show{display:block}
.intro{color:#3D4855;font-size:18px;margin:-6px 0 18px}
.stp{display:flex;gap:14px;background:#fff;border-radius:18px;padding:18px 18px 20px;margin-bottom:12px;box-shadow:0 1px 2px rgba(31,42,55,.06),0 6px 20px rgba(31,42,55,.05)}
.stp .num{flex:none;width:36px;height:36px;border-radius:50%;background:#E8F2F0;color:#2F6F6B;font-family:'Lexend',sans-serif;font-weight:700;font-size:16px;display:grid;place-items:center;transition:background .2s}
.stp.done .num{background:#2F6F6B;color:#fff}
.stp .bd{flex:1;min-width:0}
.stp h3{margin:5px 0 4px;font-size:19px}
.stp p{margin:0 0 12px;color:#4A5563;font-size:16px}
.stp .inp{margin-top:2px}
.alt{margin-top:12px;font-size:15px;color:#4A5563}
.alt[hidden]{display:none}
#printDoc{display:none}
.printhead svg{vertical-align:middle;margin-right:6px}
.steps{display:flex;gap:6px;margin-top:2px}
.step{flex:1;height:26px;border:0;padding:0;background:transparent;cursor:pointer;position:relative;border-radius:8px}
.step::before{content:"";position:absolute;left:0;right:0;top:9px;height:8px;border-radius:99px;background:#E3DDCF;transition:background .2s}
.step.done::before{background:#9CC3BD}
.step.now::before{background:#2F6F6B}
.step:focus-visible,.btn:focus-visible,.speak:focus-visible,.mic:focus-visible,.textlink:focus-visible{outline:3px solid #E9A88D;outline-offset:2px}
.screen h1:focus,.screen h2:focus{outline:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.steplabel{font-size:14px;color:#5B6675;margin-top:6px}
main{max-width:760px;margin:0 auto;padding:24px 16px 130px}
.screen{display:none}
.screen.show{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:#fff;border-radius:20px;padding:22px;box-shadow:0 1px 2px rgba(31,42,55,.06),0 6px 20px rgba(31,42,55,.05);margin-bottom:18px}
.card.featured{border:2px solid #E9B59F;background:#FFFCFA}
.kicker{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#C2694A}
.sec-title{font-size:30px;margin:4px 0 6px;font-weight:600}
.sec-intro{color:#4A5563;margin:0 0 20px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.qhead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.qhead h3{font-size:19px;font-weight:500;margin:0;line-height:1.35}
.hint{font-size:15px;color:#6B7280;margin:-4px 0 14px}
.speak{flex:none;width:40px;height:40px;border-radius:50%;border:2px solid #D9E7E4;background:#F1F7F6;color:#2F6F6B;display:grid;place-items:center;cursor:pointer;padding:0}
.speak:hover{background:#E1EFEC}
.speak.wide{width:auto;height:auto;padding:9px 16px;border-radius:999px;display:inline-flex;gap:8px;align-items:center;font-family:'Lexend',sans-serif;font-weight:500;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.opt{position:relative;cursor:pointer;user-select:none;transition:background .15s,border-color .15s,color .15s}
.opt input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.opt:focus-within{outline:3px solid #E9A88D;outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:9px;padding:10px 16px;border:2px solid #DDD6C8;border-radius:999px;background:#fff;font-size:17px}
.chip:hover{border-color:#9CC3BD}
.chip.on{background:#2F6F6B;border-color:#2F6F6B;color:#fff}
.chip.small{font-size:15px;padding:8px 14px}
.chip.unsure{border-style:dashed}
.chip.add{border-style:dashed;border-color:#E3A88F;color:#B4583A;background:#FFF8F4;font-weight:700}
.chip.add::before{content:"+";font-size:21px;line-height:1;font-weight:700}
.chip.add .mk{display:none}
.chip.add.on{background:#C2694A;border-color:#C2694A;color:#fff}
.mk{width:16px;height:16px;border:2px solid #A6AEB8;border-radius:50%;flex:none}
.mk.checkbox{border-radius:5px}
.on .mk{border-color:#fff;background:#fff;box-shadow:inset 0 0 0 3px #2F6F6B}
.otherwrap{display:none;margin-top:14px;padding:14px 16px;background:#FFF8F4;border-radius:14px}
.otherwrap.show{display:block;animation:fade .2s ease}
.otherwrap label{font-weight:700;font-size:15px;display:block;margin-bottom:8px}
.othertxt{width:100%;font:inherit;padding:10px 14px;border:2px solid #E6D3C8;border-radius:12px;background:#fff;color:#1F2A37}
.faces{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.faces.three{grid-template-columns:repeat(3,1fr);max-width:420px}
.face{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border:2px solid transparent;border-radius:16px;font-size:14px;text-align:center;background:#FAF8F3}
.face:hover{border-color:#CFE3DF}
.face.on{border-color:#2F6F6B;background:#E8F2F0;font-weight:700}
.face .mk{display:none}
.goal{border-left:6px solid #2F6F6B;background:#F3F8F7;border-radius:14px;padding:14px 18px;margin-bottom:20px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.goal .gl{font-size:13px;font-weight:700;text-transform:uppercase;color:#2F6F6B;letter-spacing:.06em}
.goal .gt{font-family:'Lexend',sans-serif;font-size:20px;font-weight:500;margin-top:2px}
.sub + .sub{margin-top:22px;padding-top:20px;border-top:1px solid #EEE9DE}
.sup,.stmt{padding:16px 0;border-top:1px solid #EEE9DE}
.sup.first,.stmt.first{border-top:0;padding-top:4px}
.sup .sn,.stmt .sn{font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.sup .speak,.stmt .speak{width:34px;height:34px}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.side{display:flex;align-items:center;justify-content:center;text-align:center;padding:18px 14px;border:2px solid #DDD6C8;border-radius:16px;background:#fff;font-weight:700;min-height:84px}
.side:hover{border-color:#9CC3BD}
.side.on{background:#2F6F6B;border-color:#2F6F6B;color:#fff}
.side .mk{display:none}
.or{align-self:center;font-family:'Lexend',sans-serif;font-weight:700;color:#C2694A;font-size:14px;width:38px;height:38px;border-radius:50%;background:#FBEDE6;display:grid;place-items:center}
.both{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:10px 0 0}
.pairwrap + .pairwrap{margin-top:22px;padding-top:20px;border-top:1px solid #EEE9DE}
textarea{width:100%;min-height:96px;border:2px solid #DDD6C8;border-radius:14px;padding:12px 14px;font:inherit;background:#FDFCF9;resize:vertical;color:#1F2A37;display:block}
textarea:focus,.othertxt:focus{outline:none;border-color:#2F6F6B;box-shadow:0 0 0 4px rgba(47,111,107,.15)}
.mic{margin-top:8px;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:2px solid #D9E7E4;background:#F1F7F6;color:#2F6F6B;font-family:'Lexend',sans-serif;font-weight:600;font-size:15px;cursor:pointer}
.mic:hover{background:#E1EFEC}
.mic.live{background:#C2694A;border-color:#C2694A;color:#fff;animation:pulse 1.3s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(194,105,74,.45)}70%{box-shadow:0 0 0 12px rgba(194,105,74,0)}100%{box-shadow:0 0 0 0 rgba(194,105,74,0)}}
.printbox,.printhead{display:none}
.follow{display:none;margin-top:14px;padding:14px 16px;border-radius:14px;background:#FBEDE6}
.follow.show{display:block;animation:fade .2s ease}
.follow .fl{font-weight:700;display:block;margin-bottom:10px;font-size:16px}
.follow .sub-l{font-weight:700;display:block;margin:14px 0 8px;font-size:15px;color:#4A5563}
.follow textarea{min-height:72px;background:#fff}
.sup .follow{margin-top:10px;padding:12px 14px}
.sup .follow .fl{font-size:15px;margin-bottom:8px}
nav.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(246,243,236,.96);backdrop-filter:blur(8px);border-top:1px solid #E6E0D3;z-index:5}
.navin{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;justify-content:space-between;gap:12px}
.btn{font-family:'Lexend',sans-serif;font-size:17px;font-weight:600;border-radius:999px;padding:13px 26px;border:2px solid #2F6F6B;cursor:pointer}
.btn.primary{background:#2F6F6B;color:#fff}
.btn.primary:hover{background:#265B58}
.btn.ghost{background:transparent;color:#2F6F6B}
.btn[hidden]{display:none}
.hero{padding:10px 0 4px}
.hero h1{font-size:42px;margin:6px 0 10px;font-weight:700}
.hero p{font-size:19px;color:#3D4855;margin:0 0 18px}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}
.mini{background:#fff;border-radius:16px;padding:16px 12px;text-align:center;font-size:15px;color:#4A5563;box-shadow:0 1px 2px rgba(31,42,55,.06)}
.mini b{display:block;font-family:'Lexend',sans-serif;font-size:17px;color:#2F6F6B;margin-bottom:2px}
details.adult{background:#fff;border-radius:16px;padding:14px 18px;border:2px dashed #DDD6C8;font-size:16px}
details.adult summary{cursor:pointer;font-weight:700;color:#2F6F6B}
details.adult ul{margin:10px 0 2px;padding-left:20px}
details.adult li{margin-bottom:6px}
.donehero{text-align:center;padding:10px 0 14px}
.check{width:76px;height:76px;border-radius:50%;background:#2F6F6B;color:#fff;display:grid;place-items:center;margin:0 auto 10px}
.donehero h2{font-size:34px;margin:8px 0}
.donehero p{color:#4A5563;margin:0 auto 6px;max-width:520px}
.handoff{font-weight:700;color:#C2694A!important;margin-top:12px!important}
.stat{font-weight:700;color:#2F6F6B}
.adultzone{border:2px dashed #CFC8B8;background:#FBFAF6;box-shadow:none}
.tag{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#5B6675;margin-bottom:10px}
#sumCard{display:none}
#sumCard.show{display:block;animation:fade .25s ease}
#sumCard h3{margin:6px 0 4px;font-size:22px}
.summary[contenteditable]{border-radius:0 10px 10px 0;transition:background .15s;cursor:text}
.summary[contenteditable]:hover{background:#FAF8F3}
.summary[contenteditable]:focus{outline:none;background:#F3F8F7;border-left-color:#2F6F6B}
.edited-tag{display:none;font-size:13px;font-weight:700;color:#C2694A;margin-left:8px}
.edited .edited-tag{display:inline}
.btn.small{font-size:15px;padding:10px 18px}
#rebuildBtn{display:none}
.edited #rebuildBtn{display:inline-block}
#printRecord{display:none}
.sumnote{font-size:14px;color:#6B7280;margin:0 0 16px}
.summary{border-left:4px solid #9CC3BD;padding:4px 0 4px 18px;margin-bottom:18px}
.summary p{margin:0 0 14px;line-height:1.65;font-size:17px}
.actions{display:flex;flex-wrap:wrap;gap:12px}
.status{color:#2F6F6B;font-weight:700;min-height:24px;margin-top:12px}
.fallback{display:none;margin-top:12px;min-height:200px;font-size:14px}
.fallback.show{display:block}
@media (max-width:560px){
 .pair{grid-template-columns:1fr}
 .or{justify-self:center}
 .faces{gap:4px}
 .face{font-size:12px;padding:8px 2px}
 .face svg{width:38px;height:38px}
 .sec-title{font-size:26px}
 .hero h1{font-size:34px}
 .minis{grid-template-columns:1fr}
 .btn{padding:12px 20px;font-size:16px}
}
@media print{
 @page{margin:.55in}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 body{background:#fff;font-size:12.5pt}
 header.top,nav.bottom,.speak,.mic,.noprint,.fallback,#setupWrap{display:none!important}
 main{padding:0;max-width:none}
 .screen{display:block!important;animation:none}
 .printhead{display:flex!important;justify-content:space-between;font-family:'Lexend',sans-serif;border-bottom:2px solid #2F6F6B;padding-bottom:6px;margin-bottom:14px;font-size:11pt}
 .card{box-shadow:none;border:1px solid #CFC8B8;break-inside:avoid;padding:14px 16px;margin-bottom:12px}
 .sec-title{font-size:20pt;margin-top:16px}
 .hero h1{font-size:24pt}
 .minis{display:none}
 .follow,.otherwrap{display:block!important;background:#fff;border:1px dashed #999}
 textarea{display:none!important}
 .printbox{display:block;min-height:60px;border:1.5px solid #9AA;border-radius:10px;padding:8px 10px;white-space:pre-wrap}
 .follow .printbox{min-height:44px}
 .othertxt{border:0;border-bottom:1.5px solid #999;border-radius:0}
 .face{border:1.5px solid #DDD}
 .face.on{border:3px solid #2F6F6B}
 .opt:focus-within{outline:none}
 details.adult{border:1px dashed #999}
 #sumCard.show{break-before:page}
 body.print-summary>*:not(#printDoc){display:none!important}
 body.print-summary #printDoc{display:block!important}
 .pd-t{width:100%;border-collapse:collapse}
 .pd-t>thead>tr>td,.pd-t>tfoot>tr>td{height:.5in;padding:0}
 .pd-t>tbody>tr>td{padding:0 .65in}
 .pd-head{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:2px solid #2F6F6B;padding-bottom:7px;margin-bottom:14px}
 .pd-head .l{display:flex;align-items:center;gap:8px;font-family:'Lexend',sans-serif;font-weight:600;font-size:13pt}
 .pd-head .l svg{display:block}
 .pd-head .r{font-size:10pt;color:#3D4855;text-align:right}
 .pd-head .r b{color:#1F2A37;font-size:11pt;margin-right:10px}
 .pd-title{font-family:'Lexend',sans-serif;font-size:19pt;font-weight:700;margin:0 0 10px}
 .pd-sum p{font-size:11.5pt;line-height:1.55;margin:0 0 9px}
 .rec-sec{break-inside:avoid}
 .rec{margin-top:16px}
 .rec-first{border-top:2px solid #2F6F6B;padding-top:8px}
 .rec-h{font-family:'Lexend',sans-serif;font-weight:600;font-size:12pt;margin-bottom:4px}
 .rec h4{font-size:10pt;text-transform:uppercase;letter-spacing:.06em;color:#C2694A;margin:10px 0 2px}
 .rec table{width:100%;border-collapse:collapse;font-size:9.5pt}
 .rec td{padding:3px 6px;border-bottom:1px solid #E6E0D3;vertical-align:top}
 .rec td:first-child{width:58%;color:#3D4855}
 .rec tr.more td:first-child{padding-left:18px;font-style:italic}
 .rec tr{break-inside:avoid}
}
</style>
</head>
<body class="setup">
<header class="top">
 <div class="topin">
  <div class="brand"><span class="brandmark"><span id="brandLogo"></span><span id="brandTitle"></span></span><span id="brandName"></span></div>
  <div class="steps" id="steps"></div>
  <div class="steplabel" id="stepLabel" aria-live="polite"></div>
 </div>
</header>
<div id="setupWrap"></div>
<main id="app"></main>
<nav class="bottom">
 <div class="navin">
  <button class="btn ghost" id="backBtn" type="button">Back</button>
  <button class="btn primary" id="nextBtn" type="button">Next</button>
 </div>
</nav>
<script>

  { "area": "Writing", "topic": "writing", "kid": "Writing a paragraph with a main idea and details",
    "hard": [
     { "kid": "Thinking of what to write", "adult": "thinking of what to write" },
     { "kid": "Spelling words", "adult": "spelling" },
     { "kid": "Handwriting", "adult": "handwriting" },
     { "kid": "Putting my ideas in order", "adult": "organizing ideas" },
     { "kid": "It takes a long time", "adult": "how long writing takes" }

  { "kid": "A planning sheet before you write", "adult": "a graphic organizer before writing" },
  { "kid": "Talk-to-type when you write", "adult": "speech-to-text for writing" },
  { "kid": "Sitting close to where your teacher teaches", "adult": "preferential seating near instruction" }
 ],
 "pairs": [
  { "a_kid": "Getting reading help in the resource room", "a_adult": "receiving reading support in the resource room",
    "b_kid": "Getting reading help in my classroom", "b_adult": "receiving reading support in the general education classroom" },
  { "a_kid": "A teacher helping me with writing in my classroom", "a_adult": "receiving writing support in the classroom",

  { "a_kid": "Taking tests with my class", "a_adult": "testing with the class",
    "b_kid": "Taking tests in a quiet room", "b_adult": "testing in a quiet room" },
  { "a_kid": "Using talk-to-type to write", "a_adult": "using speech-to-text",
    "b_kid": "Writing with a pencil", "b_adult": "writing by hand" }
 ]
};

const BRAND = { name: "ECHO", tagline: "Student voices matter" };
let S = null, PR = null;
const app = document.getElementById('app');
const registry = [];
const speakOK = 'speechSynthesis' in window;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function logo(sz,anim){const a=anim?[' class="r1"',' class="r2"',' class="r3"']:['','',''];const o=' fill="none" stroke="#CF6B3B" stroke-width="7" stroke-linecap="round"';return '<svg viewBox="0 0 64 64" width="'+sz+'" height="'+sz+'" aria-hidden="true"><path d="M31.43 4.86 A24.89 24.89 0 1 0 33.15 54.34" fill="none" stroke="#0F4D48" stroke-width="8"/><path d="M12.44 47.29 L24.53 53.33 L7.11 62.76 Z" fill="#0F4D48" stroke="#0F4D48" stroke-width="1.5" stroke-linejoin="round"/><path'+a[0]+' d="M29.87 23.64 A11.12 11.12 0 0 1 29.51 41.42"'+o+'/><path'+a[1]+' d="M37.69 15.64 A21.34 21.34 0 0 1 38.76 48.36"'+o+'/><path'+a[2]+' d="M43.56 7.11 A26.90 26.90 0 0 1 45.87 54.22"'+o+'/></svg>';}
function lockup(sz){return '<div class="lockup">'+logo(sz,true)+'<div><div class="wm">'+BRAND.name+'</div><div class="tl">'+BRAND.tagline+'</div></div></div>';}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function lowerFirst(s){return /^I\b/.test(s)?s:s.charAt(0).toLowerCase()+s.slice(1);}
function fill(t,x){const m=Object.assign({S:S.student,s:S.student,he:PR.he,him:PR.him,his:PR.his,He:cap(PR.he),His:cap(PR.his)},x||{});return String(t).replace(/\{(\w+)\}/g,(z,k)=>(k in m)?m[k]:z);}
function listJoin(a){return a.length<2?(a[0]||''):a.length===2?a[0]+' and '+a[1]:a.slice(0,-1).join(', ')+', and '+a[a.length-1];}
function qa(v,isOpt,period){let t=String(v).trim().replace(/\s+/g,' ');if(isOpt)t=lowerFirst(t);else t=t.charAt(0).toUpperCase()+t.slice(1);if(period!==false&&!/[.!?]$/.test(t))t+='.';return '"'+t+'"';}
function optKid(o){return Array.isArray(o)?o[0]:o;}
function optNarr(o){return Array.isArray(o)?fill(o[1]):lowerFirst(o);}
function checked(n){return [...document.querySelectorAll('input[name="'+n+'"]:checked')].map(i=>i.value);}
function textv(k){const t=document.querySelector('textarea[data-key="'+k+'"]');return t?t.value.trim():'';}
function otherv(k){const o=document.querySelector('input[data-other="'+k+'"]');return o?o.value.trim():'';}

function grp(role,label){return ' role="'+role+'" aria-label="'+esc(label)+'"';}
function speakBtn(t){return speakOK?'<button type="button" class="speak" aria-label="'+esc('Read aloud: '+String(t).slice(0,90))+'" data-say="'+esc(t)+'">'+SPK+'</button>':'';}
function micBtn(attr,key){return voiceOK?'<button type="button" class="mic" data-'+attr+'="'+key+'">'+MIC+'<span>Say it instead</span></button>':'';}
function qhead(t,h){return '<div class="qhead"><h3>'+esc(t)+'</h3>'+speakBtn(t)+'</div>'+(h?'<p class="hint">'+esc(h)+'</p>':'');}
function opt(name,value,label,type,cls){uid+=1;const id='o'+uid;return '<label class="opt '+(cls||'chip')+'" for="'+id+'"><input type="'+type+'" id="'+id+'" name="'+name+'" value="'+esc(value)+'"><span class="mk '+type+'"></span><span>'+esc(label)+'</span></label>';}
function ta(key,ph,label){return '<textarea data-key="'+key+'" aria-label="'+esc(label||ph||'Your answer')+'" placeholder="'+esc(ph||'Type here, or tap Say it instead.')+'"></textarea>'+micBtn('tk',key)+'<div class="printbox" data-mirror="'+key+'"></div>';}
function face(n){const my=[0,23,27,31,35,39][n];const f=['','#F4D6CC','#F7E3CF','#EFEBDD','#DCEBE3','#CFE6DF'];return '<svg viewBox="0 0 48 48" width="44" height="44" aria-hidden="true"><circle cx="24" cy="24" r="21" fill="'+f[n]+'" stroke="#1F2A37" stroke-width="2"/><circle cx="17" cy="20" r="2.4" fill="#1F2A37"/><circle cx="31" cy="20" r="2.4" fill="#1F2A37"/><path d="M15 31 Q24 '+my+' 33 31" fill="none" stroke="#1F2A37" stroke-width="2.4" stroke-linecap="round"/></svg>';}
function follow(names,fu,sec,label){
 const base=names[0];
 registry.push({sec,label:label||'Tell me more',key:base,kind:'follow',main:false});
 let h='<div class="follow" data-names="'+names.join('|')+'" data-when="'+esc(JSON.stringify(fu.when))+'"><span class="fl">'+esc(fu.prompt)+'</span>';
 if(fu.options){h+='<div class="chips"'+grp('group',fu.prompt)+'>'+fu.options.map(o=>opt(base+'_more',optKid(o),optKid(o),'checkbox','chip small')).join('')+'</div><span class="sub-l">'+esc(fu.textPrompt||'Anything else?')+'</span>';}
 return h+ta(base+'_mtxt','A few words is fine.',fu.options?(fu.textPrompt||'Anything else?'):fu.prompt)+'</div>';
}

function renderItem(it,sec){
 let h='';
 if(it.type==='checklist'){
  registry.push({sec,label:it.q,key:it.id,kind:'check',main:true});
  h+=qhead(it.q,it.hint)+'<div class="chips"'+grp('group',it.q)+'>'+it.options.map(o=>opt(it.id,optKid(o),optKid(o),'checkbox')).join('')+(it.other?opt(it.id,'__other','Something else','checkbox','chip add'):'')+'</div>';
  if(it.other) h+='<div class="otherwrap" data-ow="'+it.id+'"><label>'+esc(it.otherPrompt||'Tell us what it is:')+'</label><input class="othertxt" data-other="'+it.id+'" aria-label="'+esc(it.otherPrompt||'Something else')+'" placeholder="Type it here">'+micBtn('ok',it.id)+'</div>';
 } else if(it.type==='text'){
  registry.push({sec,label:it.q,key:it.id,kind:'text',main:true});
  h+=qhead(it.q,it.hint)+ta(it.id,null,it.q);
 } else if(it.type==='scale'){
  registry.push({sec,label:it.q,key:it.id,kind:'radio',main:true});
  const k2=S.band==='K-2';
  const lv=k2?[[1,'Hard'],[3,'Okay'],[5,'Good']]:[[1,'Really hard'],[2,'Hard'],[3,'Okay'],[4,'Good'],[5,'Really good']];
  h+=qhead(it.q,it.hint)+'<div class="faces'+(k2?' three':'')+'"'+grp('radiogroup',it.q)+'>'+lv.map(([n,l])=>{uid+=1;const id='o'+uid;return '<label class="opt face" for="'+id+'"><input type="radio" id="'+id+'" name="'+it.id+'" value="'+esc(l)+'"><span class="mk radio"></span>'+face(n)+'<span>'+esc(l)+'</span></label>';}).join('')+'</div>';
  if(it.followUp) h+=follow([it.id],it.followUp,sec);
 } else if(it.type==='choice'){
  registry.push({sec,label:it.q,key:it.id,kind:'radio',main:true});
  h+=qhead(it.q,it.hint)+'<div class="chips"'+grp('radiogroup',it.q)+'>'+it.options.map(o=>opt(it.id,o,o,'radio')).join('')+'</div>';
  if(it.followUp) h+=follow([it.id],it.followUp,sec);
 } else if(it.type==='supports'){
  h+=qhead(it.q,it.hint);
  const names=[];
  it.rows.forEach((r,i)=>{const n=it.id+'_'+i;names.push(n);registry.push({sec,label:r.k,key:n,kind:'radio',main:true});
   h+='<div class="sup'+(i===0?' first':'')+'"><div class="sn"><span>'+esc(r.k)+'</span>'+speakBtn(r.k)+'</div><div class="chips"'+grp('radiogroup',r.k)+'>'+it.options.map((o,j)=>opt(n,o,o,'radio','chip small'+(j===it.options.length-1?' unsure':''))).join('')+'</div>'
    +(it.followUp?follow([n],{when:it.followUp.when,prompt:it.followUp.prompt},sec,'More about this one'):'')+'</div>';});
 } else if(it.type==='pairs'){
  h+=qhead(it.q,it.hint);
  it.pairs.forEach((p,i)=>{const n=it.id+'_'+i;registry.push({sec,label:p.a+' or '+p.b,key:n,kind:'radio',main:true});
   h+='<div class="pairwrap"'+grp('radiogroup',p.a+' or '+p.b)+'><div class="pair">'+opt(n,p.a,p.a,'radio','side')+'<div class="or">or</div>'+opt(n,p.b,p.b,'radio','side')+'</div><div class="both">'+opt(n,'Both are okay','Both are okay','radio','chip small')+opt(n,'Neither works for me','Neither works for me','radio','chip small')+'</div></div>';});
 } else if(it.type==='ync'){
  h+=qhead(it.q,it.hint);
  it.statements.forEach((st,i)=>{const n=it.id+'_'+i;registry.push({sec,label:st.s,key:n,kind:'radio',main:true});
   h+='<div class="stmt'+(i===0?' first':'')+'"><div class="sn"><span>'+esc(st.s)+'</span>'+speakBtn(st.s)+'</div><div class="chips"'+grp('radiogroup',st.s)+'>'+(st.options||['Yes','Sometimes','No']).map(o=>opt(n,o,o,'radio')).join('')+'</div></div>';});
 } else if(it.type==='goal'){
  h+='<div class="goal"><div><div class="gl">'+esc(it.label)+'</div><div class="gt">'+esc(it.title)+'</div></div>'+speakBtn(it.label+'. '+it.title)+'</div>';
  h+=it.items.map(s=>'<div class="sub">'+renderItem(s,sec)+'</div>').join('');
 }
 return h;
}

function screens(){return [...document.querySelectorAll('.screen')];}
function show(i){
 const sc=screens();cur=Math.max(0,Math.min(i,sc.length-1));
 sc.forEach((s,j)=>s.classList.toggle('show',j===cur));
 const n=S.sections.length,last=sc.length-1;
 document.querySelectorAll('.step').forEach((b,j)=>{b.classList.toggle('now',j+1===cur);b.classList.toggle('done',j+1<cur||cur===last);});
 document.getElementById('stepLabel').textContent=cur===0?'Welcome':cur===last?'All done':'Part '+cur+' of '+n+': '+S.sections[cur-1].title;
 const back=document.getElementById('backBtn'),next=document.getElementById('nextBtn');
 back.hidden=cur===0;next.hidden=cur===last;
 next.textContent=cur===0?"Let's start":cur===n?'Finish':'Next';
 if(cur>0) started=true;
 if(cur===last){done=true;recap();if(document.getElementById('sumCard').classList.contains('show')&&!edited)renderSummary();}
 if(speakOK) speechSynthesis.cancel();
 if(rec) rec.stop();
 const calm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 window.scrollTo({top:0,behavior:calm?'auto':'smooth'});
 const hd=sc[cur].querySelector('h1,h2');if(hd){hd.setAttribute('tabindex','-1');setTimeout(()=>{try{hd.focus({preventScroll:true});}catch(e){}},60);}
}

function val(r){
 if(r.kind==='text') return textv(r.key);
 if(r.kind==='follow'){const f=document.querySelector('.follow[data-names="'+r.key+'"]');if(f&&!f.classList.contains('show'))return '';const a=checked(r.key+'_more'),t=textv(r.key+'_mtxt');return [a.join('; '),t?'"'+t+'"':''].filter(Boolean).join('; ');}
 let a=checked(r.key);
 if(a.includes('__other')){a=a.filter(x=>x!=='__other');a.push('other: '+(otherv(r.key)||'(not written)'));}
 return a.join('; ');
}
function recap(){
 const m=registry.filter(r=>r.main),a=m.filter(r=>val(r)).length;
 document.getElementById('recap').innerHTML='<span class="stat">You answered '+a+' of '+m.length+' questions.</span>'+(a<m.length?' Skipping is okay. You can tap Back to add more.':'');
}

function narrFollow(it,v,out){
 const fu=it.followUp;if(!fu||!fu.when.includes(v))return;
 const map={};(fu.options||[]).forEach(o=>{map[optKid(o)]=optNarr(o);});
 const fv=checked(it.id+'_more');
 if(fv.length&&fu.narr) out.push(fill(fu.narr,{list:listJoin(fv.map(x=>map[x]||lowerFirst(x)))}));
 const ft=textv(it.id+'_mtxt');
 if(ft) out.push(fill(fu.textNarr||'{He} added, {a}',{a:qa(ft,false)}));
}
function narrItem(it,out){
 const t=it.type;
 if(t==='goal'){it.items.forEach(s=>narrItem(s,out));return;}
 if(t==='checklist'){
  const v=checked(it.id);if(!v.length)return;
  const map={};it.options.forEach(o=>{map[optKid(o)]=optNarr(o);});
  const items=v.map(x=>{if(x==='__other'){const o=otherv(it.id);return o?fill('something {he} described as ')+'"'+o+'"':'something else';}return map[x]||lowerFirst(x);});
  out.push(fill(it.narr,{list:listJoin(items),things:items.length>1?'things':'something'}));return;
 }
 if(t==='text'){const v=textv(it.id);if(v)out.push(fill(it.narr,{a:qa(v,false)}));return;}
 if(t==='scale'||t==='choice'){const v=checked(it.id)[0];if(!v)return;out.push(fill(it.narr,{a:qa(v,true)}));narrFollow(it,v,out);return;}
 if(t==='supports'){
  const g=it.options.map(()=>[]),skip=[];
  it.rows.forEach((r,i)=>{const v=checked(it.id+'_'+i)[0];const n=fill(r.n);if(!v){skip.push(n);return;}g[it.options.indexOf(v)].push(n);});
  g.forEach((arr,j)=>{if(arr.length)out.push(fill(it.optNarr[j],{list:listJoin(arr)}));});
  if(it.followUp) it.rows.forEach((r,i)=>{const v=checked(it.id+'_'+i)[0],ft=textv(it.id+'_'+i+'_mtxt');
   if(ft&&it.followUp.when.includes(v)) out.push(fill('When asked about {x}, {he} said, {a}',{x:fill(r.n),a:qa(ft,false)}));});
  if(skip.length&&it.skipNarr) out.push(fill(it.skipNarr,{list:listJoin(skip)}));
  return;
 }
 if(t==='pairs'){
  const s=[];
  it.pairs.forEach((p,i)=>{const v=checked(it.id+'_'+i)[0];if(!v)return;const x=fill(p.an),y=fill(p.bn);
   if(v===p.a)s.push(fill('{He} preferred {x} over {y}.',{x,y}));
   else if(v===p.b)s.push(fill('{He} preferred {y} over {x}.',{x,y}));
   else if(v==='Neither works for me')s.push(fill('{He} said neither {x} nor {y} worked well for {him}.',{x,y}));
   else s.push(fill('{He} said both {x} and {y} were okay with {him}.',{x,y}));});
  if(s.length){out.push(fill(it.narrLead));s.forEach(z=>out.push(z));}
  return;
 }
 if(t==='ync'){
  const groups={},order=[];
  it.statements.forEach((st,i)=>{const v=checked(it.id+'_'+i)[0];if(!v)return;if(!groups[v]){groups[v]=[];order.push(v);}groups[v].push(fill(st.n));});
  order.forEach((v,j)=>out.push(fill((j?'{He}':'{S}')+' answered {a} when asked {list}.',{a:qa(v,true,false),list:listJoin(groups[v])})));
 }
}
function narrative(){
 const d=new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
 const mains=registry.filter(r=>r.main),answered=mains.filter(r=>val(r)).length;
 const verb=answered>=Math.ceil(mains.length/2)?'completed':'responded to part of';
 const paras=[fill('{S} '+verb+' a Student Input Survey on '+d+'.')+' '+fill(S.summaryIntro)];
 S.sections.forEach(sec=>{const out=[];sec.items.forEach(it=>narrItem(it,out));if(out.length)paras.push(out.join(' '));});
 return paras;
}
let edited=false;
function renderSummary(){
 const p=narrative();
 document.getElementById('summary').innerHTML=p.map(x=>'<p>'+esc(x)+'</p>').join('');
 edited=false;document.getElementById('sumCard').classList.remove('edited');
}
function summaryText(){
 const el=document.getElementById('summary');
 const ps=[...el.children].map(c=>(c.innerText||c.textContent||'').trim()).filter(Boolean);
 return (ps.length?ps.join('\n\n'):(el.innerText||el.textContent||'').trim());
}
function buildRecord(){
 const groups=[];let g=null;
 registry.forEach(r=>{const v=val(r);if(!r.main&&!v)return;
  if(!g||g.sec!==r.sec){g={sec:r.sec,rows:''};groups.push(g);}
  g.rows+='<tr'+(r.main?'':' class="more"')+'><td>'+esc(r.label)+'</td><td>'+esc(v||'(skipped)')+'</td></tr>';});
 return '<div class="rec">'+groups.map((x,i)=>'<div class="rec-sec'+(i===0?' rec-first':'')+'">'+(i===0?'<div class="rec-h">Responses at a glance</div>':'')+'<h4>'+esc(x.sec)+'</h4><table>'+x.rows+'</table></div>').join('')+'</div>';
}
function buildPrintDoc(){
 const d=new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
 const sum=summaryText().split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean).map(x=>'<p>'+esc(x)+'</p>').join('');
 let pd=document.getElementById('printDoc');if(!pd){pd=document.createElement('div');pd.id='printDoc';document.body.appendChild(pd);}
 pd.innerHTML='<table class="pd-t"><thead><tr><td></td></tr></thead><tfoot><tr><td></td></tr></tfoot><tbody><tr><td>'
  +'<div class="pd-head"><div class="l">'+logo(24,false)+'Student Input Summary</div><div class="r"><b>'+esc(S.student)+'</b>Report generated: '+d+'</div></div>'
  +'<div class="pd-title">What '+esc(S.student)+' Shared</div><div class="pd-sum">'+sum+'</div>'+buildRecord()
  +'</td></tr></tbody></table>';
}
function printSummary(){
 buildPrintDoc();
 let st=document.getElementById('pdPage');if(!st){st=document.createElement('style');st.id='pdPage';document.head.appendChild(st);}
 st.textContent='@page{margin:0}';document.body.classList.add('print-summary');
 const done=()=>{document.body.classList.remove('print-summary');st.textContent='';window.removeEventListener('afterprint',done);};
 window.addEventListener('afterprint',done);window.print();setTimeout(()=>{if(!window.matchMedia('print').matches)done();},1500);
}

function speak(t){if(!speakOK)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=0.9;speechSynthesis.speak(u);}
function updateFollows(name){
 document.querySelectorAll('.follow').forEach(f=>{const ns=f.dataset.names.split('|');if(!ns.includes(name))return;const w=JSON.parse(f.dataset.when);

 if(!o||!Array.isArray(o.sections)||!o.sections.length||o.sections.length>7)throw packetError('This does not look like an ECHO reply. Paste the AI\'s whole reply.');
 o.sections.forEach(sec=>{if(!sec.title)throw new Error('title');checkItems(sec.items);});
 const p=o.pronouns||{};if(!p.he||!p.him||!p.his)throw new Error('pronouns');
 o.title=BRAND.name;o.sourceTitle=o.sourceTitle||'ECHO Student Input Survey';o.minutes=o.minutes||10;
 if(o.allowVoice===undefined)o.allowVoice=true;o.grade=o.grade||'';o.band=o.band||'3-5';
 o._raw=raw;return o;}
function findJson(t){
 let k=t.search(/"echo"\s*:/);if(k<0)k=t.search(/"sections"\s*:/);
 let a=k<0?t.indexOf('{'):t.lastIndexOf('{',k);if(a<0)return '';
 let depth=0,inStr=false,esc2=false;
 for(let i=a;i<t.length;i+=1){const c=t[i];
  if(inStr){if(esc2)esc2=false;else if(c==='\\')esc2=true;else if(c==='"')inStr=false;continue;}
  if(c==='"')inStr=true;else if(c==='{')depth+=1;else if(c==='}'){depth-=1;if(depth===0)return t.slice(a,i+1);}}
 return t.slice(a,t.lastIndexOf('}')+1);
}

r you right now?\" (for example \"math\" or \"starting conversations\"). Do not use \"my.\"\n  \"kid\": the goal in student wording\n  \"hard\": a list of 4 to 6 common things that can make this skill hard, each with \"kid\" and \"adult\" wording. Keep them neutral and never blaming.\n\"supports\": a list of supports, each with \"kid\" and \"adult\" wording\n\"pairs\": a list of 2 to 4 pairs, each with \"a_kid\", \"a_adult\", \"b_kid\", and \"b_adult\"\n\nJSON rules (the ECHO page cannot read the survey code if these are broken):\nUse straight double quotes around every key and every text value.\nNever put a double quote inside a text value. Use an apostrophe or rephrase.\nNo comments, no trailing commas, no extra fields, and nothing else inside the code block.\n\nEXAMPLE SURVEY CODE (a fictional 4th grader, for format only; do not copy its content)\n{\n \"echo\": 1,\n \"grade\": \"4th grade\",\n \"band\": \"3-5\",\n \"pronoun\": \"he\",\n \"strengths\": [\n  \"Building things\",\n  \"Drawing or art\"\n ],\n \"goals\": [\n  {\n   \"area\": \"Reading\",\n   \"topic\": \"reading\",\n   \"kid\": \"Reading smoothly without getting stuck on words\",\n   \"hard\": [\n    {\n     \"kid\": \"Sounding out long words\",\n     \"adult\": \"sounding out long words\"\n    },\n    {\n     \"kid\": \"Reading out loud in front of others\",\n     \"adult\": \"reading aloud in front of others\"\n    },\n    {\n     \"kid\": \"Reading fast enough\",\n     \"adult\": \"reading quickly enough\"\n    },\n    {\n     \"kid\": \"Remembering what I read\",\n     \"adult\": \"remembering what was read\"\n    },\n    {\n     \"kid\": \"Pages with lots of words\",\n     \"adult\": \"pages with a lot of text\"\n    }\n   ]\n  },\n  {\n   \"area\": \"Writing\",\n   \"topic\": \"writing\",\n   \"kid\": \"Writing a paragraph with a main idea and details\",\n   \"hard\": [\n    {\n     \"kid\": \"Thinking of what to write\",\n     \"adult\": \"thinking of what to write\"\n    },\n    {\n     \"kid\": \"Spelling words\",\n     \"adult\": \"spelling\"\n    },\n    {\n     \"kid\": \"Handwriting\",\n     \"adult\": \"handwriting\"\n    },\n    {\n     \"kid\": \"Putting my ideas in order\",\n     \"adult\": \"organizing ideas\"\n    },\n    {\n     \"kid\": \"It takes a long time\",\n     \"adult\": \"how long writing takes\"\n    }\n   ]\n  }\n ],\n \"supports\": [\n  {\n   \"kid\": \"Extra time on tests\",\n   \"adult\": \"extra time on tests\"\n  },\n  {\n   \"kid\": \"Having tests read out loud\",\n   \"adult\": \"tests read aloud\"\n  },\n  {\n   \"kid\": \"Taking tests in a quiet room\",\n   \"adult\": \"testing in a separate, quiet setting\"\n  },\n  {\n   \"kid\": \"A planning sheet before you write\",\n   \"adult\": \"a graphic organizer before writing\"\n  },\n  {\n   \"kid\": \"Talk-to-type when you write\",\n   \"adult\": \"speech-to-text for writing\"\n  },\n  {\n   \"kid\": \"Sitting close to where your teacher teaches\",\n   \"adult\": \"preferential seating near instruction\"\n  }\n ],\n \"pairs\": [\n  {\n   \"a_kid\": \"Getting reading help in the resource room\",\n   \"a_adult\": \"receiving reading support in the resource room\",\n   \"b_kid\": \"Getting reading help in my classroom\",\n   \"b_adult\": \"receiving reading support in the general education classroom\"\n  },\n  {\n   \"a_kid\": \"A teacher helping me with writing in my classroom\",\n   \"a_adult\": \"receiving writing support in the classroom\",\n   \"b_kid\": \"Going to another room for writing help\",\n   \"b_adult\": \"receiving writing support in a separate room\"\n  },\n  {\n   \"a_kid\": \"Taking tests with my class\",\n   \"a_adult\": \"testing with the class\",\n   \"b_kid\": \"Taking tests in a quiet room\",\n   \"b_adult\": \"testing in a quiet room\"\n  },\n  {\n   \"a_kid\": \"Using talk-to-type to write\",\n   \"a_adult\": \"using speech-to-text\",\n   \"b_kid\": \"Writing with a pencil\",\n   \"b_adult\": \"writing by hand\"\n  }\n ]\n}\n\nAfter the code block, end  let h=lockup(70);
 if(mode==='link'){
  h+='<p class="intro">A short survey made from '+(loaded.grade?'a '+esc(loaded.grade)+' student\'s':'the student\'s')+' IEP, so their voice is part of the meeting.</p>'
   +'<div class="ready" style="margin:0 0 12px">'+CHECK+'Survey loaded from your link</div>'
   +stp(1,'st3','Add the student\'s first name','',name)
   +stp(2,'st4','Start the survey','Then hand the device to the student.',go);
 } else {
  h+='<p class="intro">Build a short survey from a student\'s IEP, so their voice is part of the meeting.</p>'
   +(info?'<div class="msg bad" style="margin:0 0 12px">'+esc(info)+'</div>':'')
   +stp(1,'st1','Get the prompt','Copy it, then open Gemini or another AI tool your district approves. Paste the prompt, attach the redacted IEP, and type the grade and he, she, or they.',
     '<button type="button" class="btn ghost" id="promptBtn">Copy the prompt</button><div class="msg" id="promptMsg" aria-live="polite"></div><textarea class="inp" id="promptOut" readonly></textarea>')
   +stp(2,'st2','Paste the AI\'s reply','Copy the AI\'s whole reply and paste it here.',
     '<textarea class="inp" id="packet" placeholder="Paste the whole reply here"></textarea><div class="msg" id="packetMsg" aria-live="polite"></div><div class="alt" id="linkAlt" hidden>Someone else giving the survey? <button type="button" class="textlink" id="linkBtn">Copy a survey link</button> to email them instead.<div class="msg" id="linkMsg" aria-live="polite"></div><textarea class="inp" id="linkOut" readonly></textarea></div>')
   +stp(3,'st3','Add the student\'s first name','',name)
   +stp(4,'st4','Start the survey','Then hand the device to the student.',go)
   +'<div class="center"><button type="button" class="textlink" id="sampleBtn">Just exploring? Try a sample survey</button></div>';
 }
 w.innerHTML=h;
}
function msg(id,cls,t){const e=document.getElementById(id);if(e){e.className='msg '+cls;e.textContent=t;}}
function readPacketBox(){
 const box=document.getElementById('packet');if(!box)return loaded;
 const alt=document.getElementById('linkAlt');
 if(!box.value.trim()){msg('packetMsg','bad','Paste the AI\'s reply first.');markStep('st2',false);if(alt)alt.hidden=true;return null;}
 try{loaded=parsePasted(box.value);msg('packetMsg','ok','Survey ready: '+loaded.sections.length+' parts'+(loaded.grade?', '+loaded.grade:'')+'.');markStep('st2',true);if(alt)alt.hidden=false;return loaded;}
 catch(e){loaded=null;markStep('st2',false);if(alt)alt.hidden=true;msg('packetMsg','bad',e.friendly?e.message:'That reply did not load. Copy the AI\'s whole reply again.');return null;}
}
document.getElementById('setupWrap').addEventListener('input',e=>{if(e.target.id==='packet'){const v=e.target.value.trim();if(v.length>20&&v.lastIndexOf('}')>0)readPacketBox();else{msg('packetMsg','','');markStep('st2',false);}}
 if(e.target.id==='fname')markStep('st3',!!cleanName(e.target.value));});
document.getElementById('setupWrap').addEventListener('keydown',e=>{if(e.target.id==='fname'&&e.key==='Enter'){e.preventDefault();document.getElementById('goBtn').click();}});
document.getElementById('setupWrap').addEventListener('click',async e=>{
 const id=(e.target.closest('button')||{}).id;
 if(id==='goBtn'){const o=readPacketBox();if(!o)return;const n=cleanName(document.getElementById('fname').value);
  if(!n){msg('setupMsg','bad','Type the student\'s first name to begin.');document.getElementById('fname').focus();return;}
  startSurvey(o,n);}
 if(id==='promptBtn'){const out=document.getElementById('promptOut');
  (navigator.clipboard?navigator.clipboard.writeText(AI_PROMPT):Promise.reject()).then(()=>{msg('promptMsg','ok','Prompt copied. Paste it into your AI tool.');markStep('st1',true);out.classList.remove('show');})
   .catch(()=>{out.value=AI_PROMPT;out.classList.add('show');out.focus();out.select();msg('promptMsg','bad','Copying was blocked. Select the text below and copy it.');markStep('st1',true);});}
 if(id==='sampleBtn'){const n=cleanName((document.getElementById('fname')||{}).value||'')||'Wally';startSurvey(checkPacket(JSON.parse(JSON.stringify(SAMPLE))),n);}
 if(id==='linkBtn'){const o=readPacketBox();if(!o)return;
  const link=location.origin+location.pathname+'#s='+(await encodePacket(o._raw||o));
  const out=document.getElementById('linkOut');
  (navigator.clipboard?navigator.clipboard.writeText(link):Promise.reject()).then(()=>{msg('linkMsg','ok','Link copied. Paste it into a district email. The link never includes the student\'s name.');out.classList.remove('show');})
   .catch(()=>{out.value=link;out.classList.add('show');out.focus();out.select();msg('linkMsg','bad','Copying was blocked. Select the link below and copy it.');});}
});
(async function init(){
 document.getElementById('brandLogo').innerHTML=logo(28,false);
 document.getElementById('brandTitle').textContent=BRAND.name;
 const m=location.hash.match(/[#&]s=([A-Za-z0-9_-]+)/);
 if(m){try{loaded=await decodePacket(m[1]);renderSetup('link');return;}
  catch(e){renderSetup('paste','This survey link did not open correctly. Ask for a new link, or build the survey below.');return;}}
 renderSetup('paste');
})();
</script>
